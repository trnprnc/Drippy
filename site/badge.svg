<svg xmlns="http://www.w3.org/2000/svg" width="211" height="28" viewBox="0 0 211 28" role="img" aria-label="Drippy: built for Claude Code">
  <title>Drippy — built for Claude Code</title>
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6dd"/>
      <stop offset="1" stop-color="#16c0b2"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242a33"/>
      <stop offset="1" stop-color="#1a1f26"/>
    </linearGradient>
  </defs>

  <!-- the pill, echoing Drippy's own menu-bar shape -->
  <rect x="0.5" y="0.5" width="210" height="27" rx="13.5" fill="url(#pill)" stroke="rgba(255,255,255,0.12)"/>

  <!-- droplet -->
  <path d="M15 6.2c3.1 3.9 4.8 6.4 4.8 8.5a4.8 4.8 0 0 1-9.6 0c0-2.1 1.7-4.6 4.8-8.5z" fill="url(#drop)"/>
  <ellipse cx="13.4" cy="12.4" rx="1.05" ry="1.5" fill="#ffffff" opacity="0.5"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5">
    <text x="27" y="18" fill="#f2f3f5" font-weight="700">Drippy</text>
    <text x="70.5" y="18" fill="#7d8794">·</text>
    <text x="79" y="18" fill="#c6ccd4" font-weight="500">built for Claude Code</text>
  </g>
</svg>
