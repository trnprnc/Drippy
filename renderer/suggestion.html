<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #card {
    margin: 8px;
    padding: 11px 13px 10px;
    border-radius: 12px;
    background: light-dark(rgba(255,255,255,.97), rgba(29,34,43,.97));
    color: light-dark(#1a1a1a, #e8e8e8);
    border: 1px solid oklch(0.66 0.11 200 / .5);
    box-shadow: 0 8px 24px rgba(0,0,0,.32);
    font: 12.5px/1.5 -apple-system, system-ui, sans-serif;
  }
  #head { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  #head i {
    width: 8px; height: 8px; flex: none; border-radius: 50%;
    background: oklch(0.72 0.11 200);
  }
  #head b { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: oklch(0.62 0.09 200); }
  #text { color: light-dark(#1a1a1a, #e8e8e8); }
  #actions { display: flex; gap: 6px; margin-top: 9px; }
  button {
    padding: 3px 11px; border-radius: 7px; cursor: pointer; font: 11.5px -apple-system, system-ui, sans-serif;
    border: 1px solid light-dark(rgba(0,0,0,.18), rgba(255,255,255,.22));
    background: light-dark(#fff, #2c333e); color: inherit;
  }
  #ok { border-color: oklch(0.66 0.11 200 / .5); }
  #ok:hover { background: oklch(0.66 0.11 200 / .14); }
  #no:hover { background: light-dark(#f0efe9, #3a4250); }
</style>
</head>
<body>
  <div id="card">
    <div id="head"><i></i><b>DRIPPY SUGGESTS</b></div>
    <div id="text"></div>
    <div id="actions">
      <button id="ok" onclick="window.drippySuggest.act()">Useful</button>
      <button id="no" onclick="window.drippySuggest.dismiss()">Dismiss</button>
    </div>
  </div>
<script>
  document.body.addEventListener('mouseenter', () => window.drippySuggest.hover(true));
  document.body.addEventListener('mouseleave', () => window.drippySuggest.hover(false));
  window.drippySuggest.onData((d) => {
    document.getElementById('text').textContent = d.text;
    requestAnimationFrame(() => {
      const c = document.getElementById('card');
      window.drippySuggest.reportHeight(Math.ceil(c.getBoundingClientRect().height) + 16);
    });
  });
</script>
</body>
</html>
