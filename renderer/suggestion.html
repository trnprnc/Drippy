<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #card {
    position: relative;
    margin: 8px 8px 16px;
    padding: 10px 13px 11px;
    border-radius: 12px;
    background: light-dark(rgba(255,255,255,.97), rgba(29,34,43,.97));
    color: light-dark(#1a1a1a, #e8e8e8);
    border: 1px solid oklch(0.66 0.11 200 / .5);
    box-shadow: 0 8px 24px rgba(0,0,0,.32);
    font: 12.5px/1.5 -apple-system, system-ui, sans-serif;
    transform-origin: var(--tail-x, 50%) 100%;
  }
  /* Speech-bubble tail pointing down at Drippy below. */
  #card::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: var(--tail-x, 40px);
    width: 14px;
    height: 14px;
    transform: rotate(45deg);
    background: inherit;
    border: inherit;
    border-top: none;
    border-left: none;
    border-bottom-right-radius: 3px;
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(.72) translateY(7px); }
    65% { transform: scale(1.035) translateY(-1px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  #card.pop { animation: popIn .34s cubic-bezier(.3, 1.3, .6, 1); }
  #head { display: flex; align-items: center; gap: 7px; }
  /* A tiny Drippy blob signs the card. */
  #head .mini {
    width: 13px; height: 12px; flex: none;
    border-radius: 47% 53% 55% 45% / 55% 49% 51% 45%;
    background: linear-gradient(165deg, oklch(0.85 0.09 195), oklch(0.66 0.11 210));
    box-shadow: inset 0 -2px 3px rgba(0,60,70,.35), inset 0 1px 1.5px rgba(255,255,255,.45);
  }
  #head b { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: oklch(0.62 0.09 200); flex: 1; }
  /* Dismiss is a quiet ×, not a competing button. */
  #x {
    width: 18px; height: 18px; border: none; border-radius: 5px; padding: 0;
    background: none; cursor: pointer;
    color: light-dark(rgba(0,0,0,.35), rgba(255,255,255,.35));
    font: 500 14px/18px -apple-system, system-ui, sans-serif;
  }
  #x:hover { background: light-dark(rgba(0,0,0,.06), rgba(255,255,255,.1)); color: light-dark(rgba(0,0,0,.6), rgba(255,255,255,.6)); }
  /* The reason this fired, so nothing feels random. */
  #why { font-size: 11px; color: light-dark(rgba(0,0,0,.42), rgba(255,255,255,.42)); margin: 1px 0 3px 20px; }
  #text { color: light-dark(#1a1a1a, #e8e8e8); white-space: pre-line; }
  #actions { display: flex; gap: 6px; margin-top: 9px; }
  #do {
    padding: 3.5px 12px; border-radius: 7px; cursor: pointer;
    font: 600 11.5px -apple-system, system-ui, sans-serif;
    border: 1px solid oklch(0.66 0.11 200 / .55);
    background: oklch(0.66 0.11 200 / .14);
    color: inherit;
  }
  #do:hover { background: oklch(0.66 0.11 200 / .26); }
  #do:disabled { cursor: default; opacity: .85; }
</style>
</head>
<body>
  <div id="card">
    <div id="head"><div class="mini"></div><b>DRIPPY NOTICED</b><button id="x" title="Dismiss">×</button></div>
    <div id="why"></div>
    <div id="text"></div>
    <div id="actions"><button id="do"></button></div>
  </div>
<script>
  document.body.addEventListener('mouseenter', () => window.drippySuggest.hover(true));
  document.body.addEventListener('mouseleave', () => window.drippySuggest.hover(false));
  const card = document.getElementById('card');
  const $ = (id) => document.getElementById(id);
  let current = null;

  window.drippySuggest.onTail(({ tailX }) => card.style.setProperty('--tail-x', tailX + 'px'));

  const reportHeight = () =>
    requestAnimationFrame(() => window.drippySuggest.reportHeight(card.offsetHeight + 24));

  $('x').addEventListener('click', () => window.drippySuggest.dismiss());

  $('do').addEventListener('click', () => {
    if (!current || !current.action) return;
    const a = current.action;
    if (a.kind === 'reveal') {
      // Expand the detail in place; that counts as acted.
      $('text').textContent = a.payload || '';
      $('actions').style.display = 'none';
      window.drippySuggest.outcome(current.id, 'acted');
      // Restart the auto-hide clock so there is time to read.
      window.drippySuggest.hover(true);
      window.drippySuggest.hover(false);
      reportHeight();
      return;
    }
    window.drippySuggest.act(); // main performs the action
    if (a.kind === 'copy') {
      $('do').textContent = 'Copied ✓';
      $('do').disabled = true;
      setTimeout(() => window.drippySuggest.hideNow(), 1100);
    }
  });

  window.drippySuggest.onData((d) => {
    current = d;
    $('why').textContent = d.why ? 'because: ' + d.why : '';
    $('why').style.display = d.why ? '' : 'none';
    $('text').textContent = d.text;
    const hasAction = !!(d.action && d.action.label);
    $('actions').style.display = hasAction ? 'flex' : 'none';
    if (hasAction) {
      $('do').textContent = d.action.label;
      $('do').disabled = false;
    }
    card.classList.remove('pop');
    void card.offsetWidth; // restart the entrance animation
    card.classList.add('pop');
    reportHeight();
  });
</script>
</body>
</html>
