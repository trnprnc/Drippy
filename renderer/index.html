<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="drippy.css">
</head>
<body class="mode-resting">
  <div id="stage">
    <div id="holder">
      <div id="ring"></div>
      <div id="badge"></div>
      <div id="ground"></div>

      <!-- Shape-shifting: Drippy squishes his whole blob into the SHAPE of
           each object (chunky, filled, same teal skin), then pops back.
           Bicycle = "go take a break". Magnifying glass = "having a look". -->
      <div id="shapes">
        <svg id="shape-bike" class="shape" viewBox="0 0 120 82" aria-hidden="true">
          <defs>
            <linearGradient id="drippySkin" x1="0" y1="0" x2="0.7" y2="1">
              <stop offset="0" stop-color="oklch(0.85 0.09 195)"/>
              <stop offset="1" stop-color="oklch(0.66 0.11 210)"/>
            </linearGradient>
          </defs>
          <!-- chunky filled body: wheels as fat rings, frame as thick soft bars -->
          <g fill="none" stroke="url(#drippySkin)" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="28" cy="54" r="17" stroke-width="9"/>
            <circle cx="92" cy="54" r="17" stroke-width="9"/>
            <path d="M28 54 L55 54 L45 28 L28 54 Z" stroke-width="10"/>
            <path d="M55 54 L80 31 L45 28" stroke-width="10"/>
            <path d="M80 31 L92 54" stroke-width="10"/>
            <path d="M80 31 Q88 27 90 22" stroke-width="9"/>
            <path d="M38 26 Q45 25 52 27" stroke-width="9"/>
          </g>
          <circle cx="28" cy="54" r="5" fill="url(#drippySkin)"/>
          <circle cx="92" cy="54" r="5" fill="url(#drippySkin)"/>
          <circle cx="55" cy="54" r="6" fill="url(#drippySkin)"/>
        </svg>
        <svg id="shape-glass" class="shape" viewBox="0 0 120 82" aria-hidden="true">
          <defs>
            <linearGradient id="drippySkin2" x1="0" y1="0" x2="0.7" y2="1">
              <stop offset="0" stop-color="oklch(0.85 0.09 195)"/>
              <stop offset="1" stop-color="oklch(0.66 0.11 210)"/>
            </linearGradient>
          </defs>
          <!-- fat teal ring lens with a soft glassy fill + a chunky handle -->
          <circle cx="46" cy="34" r="24" fill="url(#drippySkin2)" opacity="0.28"/>
          <circle cx="46" cy="34" r="24" fill="none" stroke="url(#drippySkin2)" stroke-width="11"/>
          <path d="M62 51 L86 75" fill="none" stroke="url(#drippySkin2)" stroke-width="14" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="bob">
        <div id="squish">
          <div id="blob">
            <div class="skin" id="skinPrivacy"></div>
            <div class="skin" id="skinDim"></div>
            <div id="eyes">
              <div class="eye"></div>
              <div class="eye"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="drippy.js"></script>
</body>
</html>
