<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="drippy.css">
</head>
<body class="mode-resting">
  <div id="stage">
    <div id="holder">
      <div id="ring"></div>
      <div id="badge"></div>
      <div id="ground"></div>

      <!-- Shape-shifting: Drippy squishes his whole blob into the SHAPE of
           each object (chunky, filled, same teal skin), then pops back.
           Bicycle = "go take a break": wheels spin, streaks trail, and a
           mini Drippy face perches where the saddle should be.
           Magnifying glass = "having a look": Drippy's eyes, magnified,
           blink and dart inside the lens while a glint sweeps across. -->
      <div id="shapes">
        <svg id="shape-bike" class="shape" viewBox="0 0 120 82" aria-hidden="true">
          <defs>
            <linearGradient id="drippySkin" x1="0" y1="0" x2="0.7" y2="1">
              <stop offset="0" stop-color="oklch(0.85 0.09 195)"/>
              <stop offset="1" stop-color="oklch(0.66 0.11 210)"/>
            </linearGradient>
            <linearGradient id="drippySkinDeep" x1="0" y1="0" x2="0.6" y2="1">
              <stop offset="0" stop-color="oklch(0.78 0.10 200)"/>
              <stop offset="1" stop-color="oklch(0.60 0.11 215)"/>
            </linearGradient>
          </defs>
          <!-- speed streaks trailing the rear wheel -->
          <g class="streaks" fill="none" stroke="oklch(0.80 0.07 200)" stroke-width="3.5" stroke-linecap="round">
            <path d="M7 38 H21"/>
            <path d="M2 50 H14"/>
            <path d="M8 62 H18"/>
          </g>
          <g class="rig">
            <!-- wheels: fat teal rings with spinning spokes -->
            <g class="wheel">
              <circle cx="30" cy="57" r="16" fill="none" stroke="url(#drippySkinDeep)" stroke-width="7.5"/>
              <g class="spokes" stroke="oklch(0.82 0.08 198)" stroke-width="2.4" stroke-linecap="round">
                <path d="M30 47.5 V66.5"/>
                <path d="M21.8 52.25 L38.2 61.75"/>
                <path d="M21.8 61.75 L38.2 52.25"/>
              </g>
              <circle cx="30" cy="57" r="4" fill="url(#drippySkin)"/>
            </g>
            <g class="wheel">
              <circle cx="90" cy="57" r="16" fill="none" stroke="url(#drippySkinDeep)" stroke-width="7.5"/>
              <g class="spokes" stroke="oklch(0.82 0.08 198)" stroke-width="2.4" stroke-linecap="round">
                <path d="M90 47.5 V66.5"/>
                <path d="M81.8 52.25 L98.2 61.75"/>
                <path d="M81.8 61.75 L98.2 52.25"/>
              </g>
              <circle cx="90" cy="57" r="4" fill="url(#drippySkin)"/>
            </g>
            <!-- frame: one low swoop (a step-through), seat post, fork, bars.
                 Few lines, soft weight: elegant at 90px wide. -->
            <g fill="none" stroke="url(#drippySkin)" stroke-linecap="round" stroke-linejoin="round">
              <path d="M30 57 Q57 70 81 29" stroke-width="8"/>
              <path d="M90 57 L81 29 L84 15" stroke-width="6.5"/>
              <path d="M84 15 Q89.5 9.5 95.5 12.5" stroke-width="5.5"/>
              <path d="M55.5 50 L47.5 24" stroke-width="6.5"/>
            </g>
            <circle cx="57" cy="59.5" r="4.2" fill="url(#drippySkin)"/>
            <!-- the giveaway: Drippy's face stayed on top, riding as the saddle -->
            <g class="saddleFace">
              <ellipse cx="46.5" cy="16" rx="10" ry="8.5" fill="url(#drippySkin)"/>
              <ellipse cx="42.5" cy="10.8" rx="3.4" ry="1.8" fill="rgba(255,255,255,.4)"/>
              <g class="bikeEyes" fill="#0b2530">
                <rect class="beye" x="41.6" y="14" width="3" height="5.6" rx="1.5"/>
                <rect class="beye" x="48.4" y="14" width="3" height="5.6" rx="1.5"/>
              </g>
            </g>
          </g>
        </svg>
        <svg id="shape-glass" class="shape" viewBox="0 0 120 82" aria-hidden="true">
          <defs>
            <linearGradient id="drippySkin2" x1="0" y1="0" x2="0.7" y2="1">
              <stop offset="0" stop-color="oklch(0.85 0.09 195)"/>
              <stop offset="1" stop-color="oklch(0.66 0.11 210)"/>
            </linearGradient>
            <radialGradient id="lensGlass" cx="0.38" cy="0.32" r="0.85">
              <stop offset="0" stop-color="oklch(0.95 0.04 195)" stop-opacity="0.92"/>
              <stop offset="0.55" stop-color="oklch(0.87 0.07 198)" stop-opacity="0.80"/>
              <stop offset="1" stop-color="oklch(0.74 0.10 205)" stop-opacity="0.85"/>
            </radialGradient>
            <linearGradient id="drippySkin2Deep" x1="0" y1="0" x2="0.6" y2="1">
              <stop offset="0" stop-color="oklch(0.78 0.10 200)"/>
              <stop offset="1" stop-color="oklch(0.60 0.11 215)"/>
            </linearGradient>
            <clipPath id="lensClip"><circle cx="46" cy="34" r="22.5"/></clipPath>
          </defs>
          <g class="rig">
            <!-- chunky handle first, so the lens ring overlaps its joint -->
            <path d="M64 51.5 L89 75" fill="none" stroke="url(#drippySkin2Deep)" stroke-width="13" stroke-linecap="round"/>
            <path d="M67 52.5 L74.5 59.5" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round"/>
            <!-- glassy lens -->
            <circle cx="46" cy="34" r="22.5" fill="url(#lensGlass)"/>
            <g clip-path="url(#lensClip)">
              <!-- Drippy's own eyes, hugely magnified: he is having a CLOSE look -->
              <g class="lensEyes" fill="#0b2530">
                <rect class="leye" x="34" y="25" width="7.5" height="15" rx="3.75"/>
                <rect class="leye" x="50.5" y="25" width="7.5" height="15" rx="3.75"/>
              </g>
              <!-- glint sweeping across the glass -->
              <rect class="glint" x="41" y="1" width="10" height="66" rx="5"
                    fill="rgba(255,255,255,.45)" opacity="0"/>
            </g>
            <!-- teal ring with a deeper inner rim for depth -->
            <circle cx="46" cy="34" r="18.5" fill="none" stroke="oklch(0.55 0.10 215 / .55)" stroke-width="2.5"/>
            <circle cx="46" cy="34" r="22.5" fill="none" stroke="url(#drippySkin2)" stroke-width="9"/>
            <path d="M31.5 19.5 A 20.5 20.5 0 0 1 46 13.5" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2.8" stroke-linecap="round"/>
            <!-- a tiny inspection twinkle off the top-right of the ring -->
            <path class="spark" d="M75 12 L76.6 16.4 L81 18 L76.6 19.6 L75 24 L73.4 19.6 L69 18 L73.4 16.4 Z"
                  fill="oklch(0.9 0.06 195)" opacity="0"/>
          </g>
        </svg>
      </div>
      <div id="bob">
        <div id="squish">
          <div id="blob">
            <div class="skin" id="skinPrivacy"></div>
            <div class="skin" id="skinDim"></div>
            <div id="eyes">
              <div class="eye"></div>
              <div class="eye"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="drippy.js"></script>
</body>
</html>
